name: "Xpoze: Release binaries"

# Builds the Pyrefly executable of Xpoze's fork for each platform the Xpoze CI
# step's bundle ships, and publishes them as a GitHub release of the pushed tag,
# with their SHA-256 checksums in SHA256SUMS. A manual run builds and tests
# without publishing.
#
# The builds follow ecosystems/python/build_pyrefly.sh in the Xpoze CI step:
# `cargo build --release --locked -p pyrefly` on a runner of the platform, and
# on Linux for musl, statically linked, so one executable runs on every Linux
# image, glibc or musl. The executable holds musl, under its MIT licence.
# Unlike upstream's release wheels, the executables are not optimized with PGO
# or BOLT.
#
# The Rust toolchain is pinned here to an exact release, overriding
# rust-toolchain.toml's "stable", so a tag builds the same executables whenever
# it runs; raise it with each rebase onto upstream.
# Nothing is cached, as in upstream's release builds.

on:
  push:
    tags:
      - '*-xpoze.*'
  workflow_dispatch:

permissions: {}

env:
  # Retry downloads of crates and Rust toolchains more often than the default
  # of 3 attempts, as upstream's release builds do.
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  RUSTUP_TOOLCHAIN: 1.100.0

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # A release is built only from a commit on the fork's branch.
      - name: Check the commit is on xpoze/v1.5
        run: |
          git fetch --no-tags origin xpoze/v1.5
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install the Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN"
      # The bench profile turns off the release profile's fat LTO and single
      # codegen unit, which make compiling the tests very slow, as upstream's
      # tests do.
      - run: cargo test --profile bench --locked -p pyrefly --lib

  build:
    needs: test
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - platform: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - platform: darwin-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
          - platform: darwin-arm64
            os: macos-15
            target: aarch64-apple-darwin
          - platform: win32-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set Windows cargo home
        # Some dependencies cloned by Cargo have long paths, which fail the
        # build under the default cargo home on Windows, as upstream notes.
        if: ${{ runner.os == 'Windows' }}
        run: echo "CARGO_HOME=C:\\cargo" >> $env:GITHUB_ENV
      # jemalloc needs the page size of the machines the executable runs on, or
      # it segfaults (https://github.com/pyrefly-org/pyrefly/issues/380): up to
      # 64 KiB on ARM64 Linux, 16 KiB on ARM64 macOS, as upstream sets them.
      - name: Set jemalloc page size for ARM64 Linux
        if: ${{ matrix.platform == 'linux-arm64' }}
        run: echo "JEMALLOC_SYS_WITH_LG_PAGE=16" >> "$GITHUB_ENV"
      - name: Set jemalloc page size for ARM64 macOS
        if: ${{ matrix.platform == 'darwin-arm64' }}
        run: echo "JEMALLOC_SYS_WITH_LG_PAGE=14" >> "$GITHUB_ENV"
      - name: Set up the static musl build
        if: ${{ runner.os == 'Linux' }}
        env:
          TARGET: ${{ matrix.target }}
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install --yes --no-install-recommends musl-tools
          {
            echo "CC_${TARGET//-/_}=musl-gcc"
            echo "RUSTFLAGS=-C target-feature=+crt-static"
          } >> "$GITHUB_ENV"
      - name: Install the Rust toolchain
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN"
          rustup target add --toolchain "$RUSTUP_TOOLCHAIN" "$TARGET"
      - name: Build
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked -p pyrefly --target "$TARGET"
      - name: Name and test the executable
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          case $PLATFORM in win32-*) suffix=.exe ;; *) suffix= ;; esac
          mkdir dist
          cp "target/$TARGET/release/pyrefly$suffix" "dist/pyrefly-$PLATFORM$suffix"
          "dist/pyrefly-$PLATFORM$suffix" --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pyrefly-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error

  publish:
    if: ${{ github.event_name == 'push' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: pyrefly-*
          path: dist
          merge-multiple: true
      - name: Write the checksums
        working-directory: dist
        run: |
          sha256sum pyrefly-* > SHA256SUMS
          cat SHA256SUMS
      - name: Create the release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" pyrefly-* SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" \
            --notes "Pyrefly of Xpoze's fork at $TAG, built for each platform of the Xpoze CI step's bundle. SHA256SUMS holds each executable's SHA-256."
